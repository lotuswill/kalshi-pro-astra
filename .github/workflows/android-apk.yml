# Builds the Android APK from the same code as the web app.
# Run it from GitHub → Actions → "Build Android APK" → Run workflow,
# then download the kalshi-pro-apk artifact and sideload it.
#
# The android/ project is generated fresh each run (npx cap add), so
# nothing native needs to live in the repo — capacitor.config.json and
# the fetch shim in src/main.jsx are the whole native footprint.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["apk-*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android && npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kalshi-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
